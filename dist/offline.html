<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0d7652"><title>Connection needed | Market is Online</title><link rel="manifest" href="/app.webmanifest"><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;min-height:100dvh;display:grid;place-items:center;background:#f4f8f5;color:#224c3b;font:16px/1.6 system-ui;padding:24px}main{max-width:400px;text-align:center;background:white;border:1px solid #dce7df;border-radius:20px;padding:32px 24px}img{width:88px;height:88px}h1{font-size:24px;line-height:1.3}p{color:#60796c;font-size:14px}button{border:0;border-radius:10px;background:#0d7652;color:white;font:600 15px system-ui;padding:14px 26px;cursor:pointer}small{display:block;margin-top:18px;color:#60796c}</style></head><body><main><img src="/icons/mio-192.png" alt="Market is Online"><h1>Let’s get you reconnected</h1><p>Your account, orders and payments need an internet connection. Check your Wi-Fi or mobile data, then try again.</p><button id="retry" type="button">Try again</button><small id="status" role="status">No orders or payments are submitted from this offline page.</small></main><script>document.getElementById('retry').onclick=()=>location.reload();window.addEventListener('online',()=>{document.getElementById('status').textContent='Connection restored. Tap Try again to continue.'});</script></body></html>
